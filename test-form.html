<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depot Stock Transfer Entry</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background-color: #f1f5f9; color: #1e293b; padding: 25px 15px; }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #0f6fd6, #48a7f7);
      color: #ffffff;
      padding: 20px 25px;
    }
    .header h1 { font-size: 22px; font-weight: 700; }
    .header p { font-size: 13px; opacity: 0.9; margin-top: 3px; }

    .search-panel {
      background: #e2e8f0;
      padding: 12px 25px;
      display: flex;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid #cbd5e1;
    }
    .search-panel input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .btn-search {
      background: #0f172a;
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    #editBanner {
      display: none;
      background: #fef3c7;
      border-left: 5px solid #d97706;
      padding: 12px 25px;
      color: #92400e;
      font-size: 13px;
      font-weight: 600;
      justify-content: space-between;
      align-items: center;
    }
    .btn-cancel-edit {
      background: #b45309;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    form { padding: 25px; }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #0f6fd6;
      border-left: 4px solid #0f6fd6;
      padding-left: 8px;
      margin: 22px 0 14px 0;
      text-transform: uppercase;
    }
    .section-title:first-of-type { margin-top: 0; }
    .section-title.tracking-title { color: #1e40af; border-color: #1e40af; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .form-group { display: flex; flex-direction: column; }
    .form-group.full-width { grid-column: 1 / -1; }

    label {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 5px;
    }

    input, select, textarea {
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #0f6fd6;
      box-shadow: 0 0 0 3px rgba(15, 111, 214, 0.15);
    }

    .stat-display {
      background: #eff6ff;
      border: 1px dashed #93c5fd;
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: #1d4ed8;
      height: 38px;
      align-items: center;
    }

    .btn-submit {
      width: 100%;
      background: #0f6fd6;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 25px;
      transition: background 0.2s;
    }
    .btn-submit.btn-edit-mode { background: #d97706; }
    .btn-submit.btn-edit-mode:hover { background: #b45309; }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }

    #alertBox {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
      text-align: center;
      font-weight: 600;
    }
    .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Depot Stock Transfer & Vehicle Management</h1>
    </div>

    <!-- Search for Edit -->
    <div class="search-panel">
      <input type="text" id="searchQuery" placeholder="Search by SL # (e.g. 4869) No to edit.">
      <button type="button" id="btnFind" class="btn-search">Find Record</button>
    </div>

    <!-- Edit Banner -->
    <div id="editBanner">
      <span id="editBannerText">Editing SL</span>
      <button type="button" id="btnCancelEdit" class="btn-cancel-edit">Cancel Edit (Create New)</button>
    </div>

    <form id="stockForm">
      <!-- 1. DATE & DEPOT -->
      <div class="section-title">Transfer & Destination</div>
      <div class="grid">
        <div class="form-group">
          <label for="date">Date *</label>
          <input type="date" id="date" required>
        </div>
        <div class="form-group">
          <label for="depotName">Depot Name *</label>
          <select id="depotName" required>
            <option value="" disabled selected>-- Select Depot --</option>
            <option value="ShilpoPark Depot">ShilpoPark Depot</option>
            <option value="Barishal Depot">Barishal Depot</option>
            <option value="Sreemangal Depot">Sreemangal Depot</option>
            <option value="Jessore Depot">Jessore Depot</option>
            <option value="Mymensingh Depot">Mymensingh Depot</option>
            <option value="Chittagong Depot">Chittagong Depot</option>
            <option value="Bogura depot">Bogura depot</option>
            <option value="Comilla Depot">Comilla Depot</option>
          </select>
        </div>
      </div>

      <!-- 2. CARTON QUANTITIES -->
      <div class="section-title">Carton Quantities</div>
      <div class="grid">
        <div class="form-group">
          <label for="ballpen">Total Ballpen</label>
          <input type="number" id="ballpen" class="calc-ctn" value="0" min="0">
        </div>
        <div class="form-group">
          <label for="totalWriting">Total Writing</label>
          <input type="number" id="totalWriting" class="calc-ctn" value="0" min="0">
        </div>
        <div class="form-group">
          <label for="food">Food:</label>
          <input type="number" id="food" class="calc-ctn" value="0" min="0">
        </div>
        <div class="form-group">
          <label for="memo">Memo:</label>
          <input type="number" id="memo" class="calc-ctn" value="0" min="0">
        </div>
        <div class="form-group">
          <label for="others">Gifts & Others :</label>
          <input type="number" id="others" class="calc-ctn" value="0" min="0">
        </div>
        <div class="form-group">
          <label>Grand Total CTN (Auto)</label>
          <div class="stat-display">
            <span>Total:</span>
            <span id="grandTotalDisplay">0</span>
          </div>
        </div>
      </div>

      <!-- 3. FINANCIALS & LED -->
      <div class="section-title">Financials & LED Light Details</div>
      <div class="grid">
        <div class="form-group">
          <label for="stValue">ST Value (Yellow Col)</label>
          <input type="number" id="stValue" step="0.01">
        </div>
        <div class="form-group">
          <label for="vehicleRate">Vehicle Rate</label>
          <input type="number" id="vehicleRate" class="calc-cost" step="0.01">
        </div>
        <div class="form-group">
          <label for="additionalCost">Additional Cost</label>
          <input type="number" id="additionalCost" class="calc-cost" step="0.01">
        </div>
        <div class="form-group">
          <label>Per Vehicle Total Cost (Auto)</label>
          <div class="stat-display">
            <span>Cost:</span>
            <span id="vehicleCostDisplay">0</span>
          </div>
        </div>
        <div class="form-group">
          <label for="totalLedPcs">Total LED Light Pcs</label>
          <input type="number" id="totalLedPcs">
        </div>
        <div class="form-group">
          <label for="totalLedCtn">Total LED Light CTN</label>
          <input type="number" id="totalLedCtn">
        </div>
      </div>

      <!-- 4. DRIVER & VEHICLE DETAILS -->
      <div class="section-title">Driver & Vehicle Details</div>
      <div class="grid">
        <div class="form-group">
          <label for="driverName">Drivers' Name</label>
          <input type="text" id="driverName" placeholder="e.g. Rubel">
        </div>
        <div class="form-group">
          <label for="driverMobile">Drivers Mobile Number:</label>
          <input type="text" id="driverMobile" placeholder="e.g. 017xxxxxxxx">
        </div>
        <div class="form-group">
          <label for="licenseNo">License No:</label>
          <input type="text" id="licenseNo">
        </div>
        <div class="form-group">
          <label for="vehicleName">Vehicle Name</label>
          <input type="text" id="vehicleName" placeholder="e.g. Shiropa Cargo Service">
        </div>
        <div class="form-group">
          <label for="vehicleNo">Vehicle No: *</label>
          <input type="text" id="vehicleNo" placeholder="e.g. DM TA 13-2996" required>
        </div>
        <div class="form-group">
          <label for="transportName">Transport Name:</label>
          <input type="text" id="transportName" placeholder="e.g. Shiropa Cargo Service">
        </div>
        <div class="form-group">
          <label for="bookingReceiptNo">Booking Receipt No:</label>
          <input type="text" id="bookingReceiptNo" placeholder="e.g. 787">
        </div>
        <div class="form-group">
          <label for="lockNumber">Lock Number:</label>
          <input type="text" id="lockNumber" placeholder="e.g. JP 152317">
        </div>
      </div>

      <!-- 5. GATE PASS & APPROVAL -->
      <div class="section-title">Gate Pass & Authorization</div>
      <div class="grid">
        <div class="form-group">
          <label for="gatePassNo">Gate Pass No:</label>
          <input type="text" id="gatePassNo" placeholder="e.g. August 26-521(26010)">
        </div>
        <div class="form-group">
          <label for="gatePassEntryBy">Gate Pass Entry BY</label>
          <input type="text" id="gatePassEntryBy" placeholder="e.g. Tanvir">
        </div>
        <div class="form-group">
          <label for="gatePassTime">Gate Pass Time:</label>
          <input type="time" id="gatePassTime">
        </div>
        <div class="form-group">
          <label for="checkedBy">Checked by:</label>
          <input type="text" id="checkedBy" placeholder="e.g. Abdur Rahim">
        </div>
        <div class="form-group full-width">
          <label for="remarks">Remarks:</label>
          <textarea id="remarks" rows="2"></textarea>
        </div>
      </div>

      <!-- 6. TRACKING & STATUS -->
      <div class="section-title tracking-title">Tracking & Status Details</div>
      <div class="grid">
        <div class="form-group">
          <label for="vehicleQnty">Vehicle Qnty.</label>
          <input type="number" id="vehicleQnty" value="0">
        </div>
        <div class="form-group">
          <label for="actualReceivedDate">Actual Received Date</label>
          <input type="text" id="actualReceivedDate">
        </div>
        <div class="form-group">
          <label for="receivedByTracking">Actual Received by Tracking</label>
          <input type="text" id="receivedByTracking">
        </div>
        <div class="form-group full-width">
          <label for="delayNote">Note: if delay received truck</label>
          <input type="text" id="delayNote">
        </div>
      </div>

      <button type="submit" id="btnSubmit" class="btn-submit">Submit Record</button>
      <div id="alertBox"></div>
    </form>
  </div>

  <script>
    // =========================================================================
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
    // =========================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1qzVOHlIUzBLdDIrESlTxyuFnHWgzCLpQtAwFIRpi_WsbfSYg8U7oHP_9baar9OeG/exec";

    let currentEditRow = null;
    let currentEditSl = null;

    document.getElementById('date').valueAsDate = new Date();

    // Auto calculate CTN
    const ctnInputs = document.querySelectorAll('.calc-ctn');
    function updateCtn() {
      let total = 0;
      ctnInputs.forEach(i => total += Number(i.value) || 0);
      document.getElementById('grandTotalDisplay').textContent = total;
    }
    ctnInputs.forEach(i => i.addEventListener('input', updateCtn));

    // Auto calculate Total Vehicle Cost
    const costInputs = document.querySelectorAll('.calc-cost');
    function updateCost() {
      const v = Number(document.getElementById('vehicleRate').value) || 0;
      const a = Number(document.getElementById('additionalCost').value) || 0;
      document.getElementById('vehicleCostDisplay').textContent = v + a;
    }
    costInputs.forEach(i => i.addEventListener('input', updateCost));

    // SEARCH / EDIT RECORD
    document.getElementById('btnFind').addEventListener('click', function() {
      const q = document.getElementById('searchQuery').value.trim();
      if (!q) {
        alert("Please enter SL # or Gate Pass No.");
        return;
      }

      const btnFind = document.getElementById('btnFind');
      btnFind.disabled = true;
      btnFind.textContent = "Searching...";

      fetch(`${SCRIPT_URL}?query=${encodeURIComponent(q)}`)
        .then(res => res.json())
        .then(data => {
          if (!data.found) {
            alert("No matching record found for: " + q);
            return;
          }

          currentEditRow = data.rowIndex;
          currentEditSl = data.slNo;

          if (data.date) document.getElementById('date').value = data.date;
          if (data.depotName) document.getElementById('depotName').value = data.depotName;
          document.getElementById('ballpen').value = data.ballpen || 0;
          document.getElementById('totalWriting').value = data.totalWriting || 0;
          document.getElementById('food').value = data.food || 0;
          document.getElementById('memo').value = data.memo || 0;
          document.getElementById('others').value = data.others || 0;
          document.getElementById('stValue').value = data.stValue || "";
          document.getElementById('vehicleRate').value = data.vehicleRate || "";
          document.getElementById('additionalCost').value = data.additionalCost || "";
          document.getElementById('totalLedPcs').value = data.totalLedPcs || "";
          document.getElementById('totalLedCtn').value = data.totalLedCtn || "";
          document.getElementById('driverName').value = data.driverName || "";
          document.getElementById('driverMobile').value = data.driverMobile || "";
          document.getElementById('licenseNo').value = data.licenseNo || "";
          document.getElementById('vehicleName').value = data.vehicleName || "";
          document.getElementById('vehicleNo').value = data.vehicleNo || "";
          document.getElementById('transportName').value = data.transportName || "";
          document.getElementById('bookingReceiptNo').value = data.bookingReceiptNo || "";
          document.getElementById('lockNumber').value = data.lockNumber || "";
          document.getElementById('gatePassNo').value = data.gatePassNo || "";
          document.getElementById('gatePassEntryBy').value = data.gatePassEntryBy || "";
          document.getElementById('gatePassTime').value = data.gatePassTime || "";
          document.getElementById('checkedBy').value = data.checkedBy || "";
          document.getElementById('remarks').value = data.remarks || "";
          document.getElementById('vehicleQnty').value = data.vehicleQnty || "";
          document.getElementById('actualReceivedDate').value = data.actualReceivedDate || "";
          document.getElementById('receivedByTracking').value = data.receivedByTracking || "";
          document.getElementById('delayNote').value = data.delayNote || "";

          updateCtn();
          updateCost();

          document.getElementById('editBannerText').textContent = `Editing SL #${data.slNo} (Row ${data.rowIndex})`;
          document.getElementById('editBanner').style.display = "flex";
          const submitBtn = document.getElementById('btnSubmit');
          submitBtn.textContent = "Update Existing Record";
          submitBtn.classList.add('btn-edit-mode');
        })
        .catch(err => {
          alert("Search failed: " + err);
        })
        .finally(() => {
          btnFind.disabled = false;
          btnFind.textContent = "Find Record";
        });
    });

    document.getElementById('btnCancelEdit').addEventListener('click', resetForm);

    function resetForm() {
      currentEditRow = null;
      currentEditSl = null;
      document.getElementById('stockForm').reset();
      document.getElementById('date').valueAsDate = new Date();
      document.getElementById('grandTotalDisplay').textContent = "0";
      document.getElementById('vehicleCostDisplay').textContent = "0";
      document.getElementById('editBanner').style.display = "none";
      const submitBtn = document.getElementById('btnSubmit');
      submitBtn.textContent = "Submit Record";
      submitBtn.classList.remove('btn-edit-mode');
    }

    // FORM SUBMISSION VIA FETCH
    document.getElementById('stockForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('btnSubmit');
      const alertBox = document.getElementById('alertBox');

      submitBtn.disabled = true;
      submitBtn.textContent = currentEditRow ? "Updating row..." : "Adding row...";
      alertBox.style.display = "none";

      const payload = {
        action: currentEditRow ? "update" : "create",
        rowIndex: currentEditRow,
        slNo: currentEditSl,
        date: document.getElementById('date').value,
        depotName: document.getElementById('depotName').value,
        ballpen: document.getElementById('ballpen').value,
        totalWriting: document.getElementById('totalWriting').value,
        food: document.getElementById('food').value,
        memo: document.getElementById('memo').value,
        others: document.getElementById('others').value,
        stValue: document.getElementById('stValue').value,
        vehicleRate: document.getElementById('vehicleRate').value,
        additionalCost: document.getElementById('additionalCost').value,
        totalLedPcs: document.getElementById('totalLedPcs').value,
        totalLedCtn: document.getElementById('totalLedCtn').value,
        driverName: document.getElementById('driverName').value,
        driverMobile: document.getElementById('driverMobile').value,
        licenseNo: document.getElementById('licenseNo').value,
        vehicleName: document.getElementById('vehicleName').value,
        vehicleNo: document.getElementById('vehicleNo').value,
        transportName: document.getElementById('transportName').value,
        bookingReceiptNo: document.getElementById('bookingReceiptNo').value,
        lockNumber: document.getElementById('lockNumber').value,
        gatePassNo: document.getElementById('gatePassNo').value,
        gatePassEntryBy: document.getElementById('gatePassEntryBy').value,
        gatePassTime: document.getElementById('gatePassTime').value,
        checkedBy: document.getElementById('checkedBy').value,
        remarks: document.getElementById('remarks').value,
        vehicleQnty: document.getElementById('vehicleQnty').value,
        actualReceivedDate: document.getElementById('actualReceivedDate').value,
        receivedByTracking: document.getElementById('receivedByTracking').value,
        delayNote: document.getElementById('delayNote').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.result === "success") {
          alertBox.className = "alert-success";
          alertBox.textContent = currentEditRow 
            ? `Success: SL #${res.slNo} (Row ${res.row}) updated successfully!`
            : `Success: New entry saved as SL #${res.slNo}!`;
          alertBox.style.display = "block";
          resetForm();
        } else {
          throw new Error(res.message);
        }
      })
      .catch(err => {
        alertBox.className = "alert-error";
        alertBox.textContent = "Submission error: " + err.message;
        alertBox.style.display = "block";
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = currentEditRow ? "Update Existing Record" : "Submit Record";
      });
    });
  </script>
</body>
</html>
